<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Explorador público e somente leitura da blockchain WynCoin">
  <title>WynCoin Explorer</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-link aria-label="WynCoin Explorer - início"><span class="brand-mark">W</span><span><strong>WynCoin</strong><small>Blockchain Explorer</small></span></a>
    <nav aria-label="Navegação principal">
      <a href="/blocks" data-link>Blocos</a>
      <a href="/transactions" data-link>Transações</a>
      <a href="/mempool" data-link>Mempool</a>
      <a href="/network" data-link>Rede</a>
    </nav>
    <div class="node-pill" id="node-pill"><span></span><strong id="node-state">Conectando…</strong></div>
  </header>

  <main class="shell">
    <section class="search-hero">
      <div><span class="eyebrow">WYNCOIN EXPLORER</span><h1>Blockchain aberta.<br><em>Dados verificáveis.</em></h1></div>
      <form id="search-form" class="search-box" role="search">
        <label for="search-input">Buscar bloco, transação ou endereço</label>
        <div><input id="search-input" autocomplete="off" placeholder="Altura, hash, TXID ou endereço WYN…" required><button>Explorar</button></div>
        <small>Dados locais, somente leitura e atualizados automaticamente.</small>
      </form>
    </section>
    <section id="app" aria-live="polite"></section>
  </main>
  <footer><span>WynCoin Explorer <strong id="explorer-version">—</strong></span><span>Interface local e somente leitura</span></footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
