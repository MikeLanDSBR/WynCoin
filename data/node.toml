[network]
id = "wyncoin-local-v2"
listen = "127.0.0.1:9332"

[chain]
initial_target = 72057594037927935
# 50 WYN em unidades mínimas (1 WYN = 100_000_000 unidades).
block_reward = 5000000000
target_block_time_seconds = 60
retarget_interval_blocks = 20
max_retarget_factor = 4
max_transactions_per_block = 100

[mining]
enabled = true
mine_empty_blocks = true
# Um novo trabalho de mineração é iniciado neste intervalo.
interval_seconds = 60
miner_wallet = "wallets/miner.json"

[storage]
database = "blockchain.db"
