[workspace]
members = [
    "wyncoin-explorer",
    "wyncoin-core",
    "wyncoind",
    "wyncoin-cli",
    "wyncoin-wallet",
    "wyncoin-wallet-app/src-tauri",
]
resolver = "2"
default-members = [
    "wyncoin-core",
    "wyncoind",
    "wyncoin-cli",
    "wyncoin-wallet",
    "wyncoin-explorer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["WynLedger"]
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "=4.6.4", features = ["derive"] }
ctrlc = "3.4"
hex = "0.4"
rand = "0.8"
qrcode = "0.14"
rsa = { version = "=0.9.10", features = ["sha2", "pem"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = "2"
tauri-build = "2"
thiserror = "1.0"
toml = "0.8"
zeroize = "1.8"
